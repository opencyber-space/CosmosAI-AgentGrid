# NewGenTech -- what this company offers.
#
# Role in the demonstrated round: INVITED by subject id, bids genuinely and in good
# faith, and is then REJECTED BY PRE-QUALIFICATION. Its catalogue covers the work, its
# agents run the full chain and its Head Agent approves -- it fails on credentials
# alone.
#
# The rejection comes entirely from the `credentials` block: no certification, 3,500
# licences supplied against the RFP's 10,000 bar, and 2 projects served. Give it a
# certification and a larger track record and it would be scored like anyone else.
#
# This is the company that proves pre-qualification does not stall the round. Its bid is
# recorded, marked rejected by OpenArcade, and excluded by the evaluator -- while the
# other four bids still evaluate normally.

company:
  name: NewGenTech
  slug: newgentech
  subject_id: newgentech-bid-manager
  description: Recently founded video analytics vendor with broad coverage and no certification yet.
  topics: []          # invited explicitly; does not listen on the open topic

usecases:
  - id: face_recognition
    name: Face Recognition (1:N watchlist search)
    operating_conditions:
      indoor: true
      outdoor: true
      min_camera_height_m: 2.5
      max_camera_height_m: 6.5
      max_population_density: 4.0
      min_frames: 14
      min_resolution: "1920x1080"
      night_capable: true
      min_lux: 20
    accuracy:
      dataset: Internal benchmark        # not an independently audited figure
      value: 0.948
    certifications_required: ["NIST"]

  - id: crowd_multiface
    name: Simultaneous multi-face detection in crowds
    operating_conditions:
      indoor: true
      outdoor: true
      min_camera_height_m: 3.0
      max_camera_height_m: 8.0
      max_population_density: 5.5
      min_frames: 16
      min_resolution: "1920x1080"
      night_capable: true
      min_lux: 28
    accuracy:
      dataset: Internal benchmark
      value: 0.889
    certifications_required: ["NIST"]

  - id: crowd_density
    name: Crowd density estimation and live counting
    operating_conditions:
      indoor: true
      outdoor: true
      min_camera_height_m: 4.0
      max_camera_height_m: 11.0
      max_population_density: 7.0
      min_frames: 12
      min_resolution: "1280x720"
      night_capable: true
      min_lux: 35
    accuracy:
      dataset: ShanghaiTech Part A
      value: 0.861
    certifications_required: []

  - id: abandoned_object
    name: Abandoned and removed object detection
    operating_conditions:
      indoor: true
      outdoor: true
      min_camera_height_m: 3.0
      max_camera_height_m: 9.0
      max_population_density: 3.0
      min_frames: 28
      min_resolution: "1280x720"
      night_capable: true
      min_lux: 45
    accuracy:
      dataset: PETS2006
      value: 0.845
    certifications_required: []

  - id: intrusion_detection
    name: Perimeter and intrusion detection
    operating_conditions:
      indoor: true
      outdoor: true
      min_camera_height_m: 3.0
      max_camera_height_m: 10.0
      max_population_density: 2.0
      min_frames: 9
      min_resolution: "1280x720"
      night_capable: true
      min_lux: 14
    accuracy:
      dataset: VIRAT
      value: 0.902
    certifications_required: []

licensing:
  min_licenses: 100
  max_licenses: 40000

hardware:
  face_recognition:
    cpu_cores: 0.26
    ram_gb: 1.04
    disk_gb: 34.0
    gpu_count: 0.0182
    notes: Higher footprint pending the next inference-engine release.
  crowd_multiface:
    cpu_cores: 0.21
    ram_gb: 0.84
    disk_gb: 27.0
    gpu_count: 0.0143
  crowd_density:
    cpu_cores: 0.16
    ram_gb: 0.64
    disk_gb: 22.0
    gpu_count: 0.0095
  abandoned_object:
    cpu_cores: 0.13
    ram_gb: 0.52
    disk_gb: 19.0
    gpu_count: 0.0074
  intrusion_detection:
    cpu_cores: 0.11
    ram_gb: 0.44
    disk_gb: 17.0
    gpu_count: 0.0056

# Aggressively cheap -- a newer vendor buying its way in. Had it cleared
# pre-qualification it would have scored strongly on the budget dimension, which is
# exactly why the example rejects it on credentials rather than on price.
pricing:
  currency: INR
  one_time_implementation_pct: 0.09
  amc_pct: 0.07
  face_recognition:
    unit_price: 1120
    timeline_weeks_per_100_licenses: 1.8
  crowd_multiface:
    unit_price: 910
    timeline_weeks_per_100_licenses: 1.5
  crowd_density:
    unit_price: 740
    timeline_weeks_per_100_licenses: 1.3
  abandoned_object:
    unit_price: 680
    timeline_weeks_per_100_licenses: 1.1
  intrusion_detection:
    unit_price: 590
    timeline_weeks_per_100_licenses: 1.0

# The rejection lives here, and only here.
credentials:
  certifications: []          # RFP requires a performance benchmarking certificate
  projects_served: 2          # below the minimum track record
  licenses_supplied: 3500     # RFP requires at least 10,000
  past_projects:
    - {name: District Municipality Pilot, licenses: 2100, year: 2025}
    - {name: Private Campus Trial, licenses: 1400, year: 2024}

live_endpoints:
  max_live_endpoints: 2
  default_verdict: false
  # Registered and verified for real -- this company runs the full chain. The endpoints
  # simply never get scored, because its bid is excluded before the evaluator reaches
  # dimension (d).
  # Which use cases this company stands up a live endpoint for. That its endpoints exist
  # is part of the company's public profile, so it stays here. What they answer is not:
  # an answer key committed beside the company that is being graded on it is not a
  # benchmark. The answers come from an uncommitted
  # functions/va-usecase-endpoint/verdicts/<slug>_verdicts.yaml, packaged into the
  # endpoint at build time. With no such file the endpoint answers default_verdict to
  # every image, which scores 0 -- the endpoint dimension is absolute, so 0 for everyone
  # adds 0 to everyone's total and simply drops out of the comparison.
  endpoints:
    - face_recognition
    - crowd_multiface

approval:
  # Delivery cost as a fraction of the bare licence subtotal. The Head Agent
  # computes margin as (budget - subtotal * cost_ratio) / budget and refuses
  # anything under min_margin_pct.
  # Aggressive pricing against a high cost base -- thin but above this company's own low floor.
  cost_ratio: 0.85
  min_margin_pct: 8
  require_certification_evidence: false    # it has none, and approves anyway
  require_past_projects: true

# ---------------------------------------------------------------------------
# What the product actually does, in the terms the RFP asks about.
#
# The compliance agent hands this whole block to the verdict model alongside the use
# cases. Before it existed every requirement came back "the catalogue does not mention
# it" -- 37 of 37 on bid job 9a9b9f38 -- because pose tolerance, gallery size, search
# latency, enrolment, codecs and integrations appear nowhere in a use-case list. The
# model was judging honestly; it had not been shown the evidence.
#
# Numbers are the product's real limits, so a requirement can be compared against them
# rather than guessed at. Where this company cannot do something, the field says so:
# claiming otherwise wins a round the company then cannot deliver.
# ---------------------------------------------------------------------------
capabilities:

  deployment:
    gpu_servers: true                    # req 1
    gpu_vendors: [NVIDIA]                # req 17
    architecture: single_site
    edge_capable: false
  modes: [real_time]                     # req 4
  matching_modes: ["1:N"]                # req 5
  continuous_learning: false             # req 2
  inputs: [cctv_ip_camera]               # req 3
  watchlist:
    blacklist_alerts: true               # req 6
    sources: [live_feed]
    retrospective_search_on_enrolment_s: null      # req 10
  crowd:
    max_faces_per_frame: 12              # req 7: under the 20 the RFP asks for
    partial_face_recognition: false      # req 8
    concurrent_streams: 8
  pose_tolerance_deg:
    yaw: 25                              # req 7: short of +-40
    pitch: 20                            # req 7: short of +-30
    roll: 15
  video:
    colour_modes: [colour]               # req 9
    day_night: false
    codecs: ["H.264"]                    # req 9: no H.265
  search:
    latency_s: 9.0                       # req 12
    max_gallery_size: 250000             # req 12
  enrolment:
    modes: [manual]                      # req 11
  mobile_apps: []                        # req 14
  integrations:
    sdk_api: false                       # req 15
    command_control: []
    vms: []                              # req 35
    sensors: false                       # req 36
  alerting:
    email: [Gmail]                       # req 16
    customisable_per_user: false         # req 34
    priority_levels: false

platform:

  behavioural_analytics: false           # req 21
  model_training:
    annotation_tool: false               # req 23
    annotation_shapes: []
    accuracy_improves_on_existing_behaviours: false # req 22
    new_behaviours_addable: false
    runtime_model_plugin: false          # req 24, 25
    per_camera_configuration: false
  model_library:
    standardized_oem_models: false       # req 26
    comparison: []                       # req 27
    per_model_metrics: false             # req 28
  detection:
    min_object_size_pct: 20              # req 29
    behaviour_change_detection_s: null   # req 31
    multi_behaviour_per_camera: false    # req 30
  dashboard:
    unified_across_usecases: false       # req 33
    per_user_customisation: false        # req 34
  licensing_modes: [fixed]               # req 32
  privacy:
    gdpr_compliant: false                # req 37
    data_residency: unspecified
