# UltraVideoTech -- what this company offers.
#
# Role in the demonstrated round: NOT invited by name. It reaches the bid job only
# because its Bid Manager subject carries the topic `videoanalytics_bidding`, and it is
# then SCORED on merit like any other bidder.
#
# Deliberately asymmetric to CamFaceSolution: it charges more per licence but needs
# markedly less hardware, complies on one more RFP point, and answers the live endpoint
# checks more accurately. With only two survivors every relative dimension collapses to
# 25/75, so if both companies were configured alike the winner would hinge on a single
# field. Pulling the four dimensions in different directions is what makes the weighted
# sum actually decide the round.

company:
  name: UltraVideoTech
  slug: ultravideotech
  subject_id: ultravideotech-bid-manager
  description: Edge-optimised video analytics with a low per-licence hardware footprint.
  topics:
    - videoanalytics_bidding      # how it hears about the RFP at all

usecases:
  - id: face_recognition
    name: Face Recognition (1:N watchlist search)
    operating_conditions:
      indoor: true
      outdoor: true
      min_camera_height_m: 2.0
      max_camera_height_m: 7.0
      max_population_density: 5.0
      min_frames: 10
      min_resolution: "1920x1080"
      night_capable: true
      min_lux: 8
    accuracy:
      dataset: NIST FRVT 1:N
      value: 0.981
    certifications_required: ["NIST"]

  - id: crowd_multiface
    name: Simultaneous multi-face detection in crowds
    operating_conditions:
      indoor: true
      outdoor: true
      min_camera_height_m: 2.5
      max_camera_height_m: 9.0
      max_population_density: 7.5
      min_frames: 12
      min_resolution: "1920x1080"
      night_capable: true
      min_lux: 18
    accuracy:
      dataset: WIDER FACE (hard)
      value: 0.932
    certifications_required: ["NIST"]

  - id: crowd_density
    name: Crowd density estimation and live counting
    operating_conditions:
      indoor: true
      outdoor: true
      min_camera_height_m: 3.5
      max_camera_height_m: 14.0
      max_population_density: 9.0
      min_frames: 8
      min_resolution: "1280x720"
      night_capable: true
      min_lux: 22
    accuracy:
      dataset: ShanghaiTech Part A
      value: 0.908
    certifications_required: []

  - id: abandoned_object
    name: Abandoned and removed object detection
    operating_conditions:
      indoor: true
      outdoor: true
      min_camera_height_m: 2.5
      max_camera_height_m: 10.0
      max_population_density: 4.0
      min_frames: 20
      min_resolution: "1280x720"
      night_capable: true
      min_lux: 30
    accuracy:
      dataset: PETS2006
      value: 0.896
    certifications_required: []

  - id: intrusion_detection
    name: Perimeter and intrusion detection
    operating_conditions:
      indoor: true
      outdoor: true
      min_camera_height_m: 2.5
      max_camera_height_m: 12.0
      max_population_density: 2.5
      min_frames: 6
      min_resolution: "1280x720"
      night_capable: true
      min_lux: 6
    accuracy:
      dataset: VIRAT
      value: 0.941
    certifications_required: []

  - id: anpr
    name: License plate recognition / ANPR
    operating_conditions:
      indoor: false
      outdoor: true
      min_camera_height_m: 3.5
      max_camera_height_m: 9.0
      max_population_density: 1.5
      min_frames: 5
      min_resolution: "1920x1080"
      night_capable: true
      min_lux: 12
    accuracy:
      dataset: UFPR-ALPR
      value: 0.926
    certifications_required: []

  - id: video_summarization
    name: Video summarisation and back-search
    operating_conditions:
      indoor: true
      outdoor: true
      min_camera_height_m: 2.0
      max_camera_height_m: 12.0
      max_population_density: 6.0
      min_frames: 30
      min_resolution: "1280x720"
      night_capable: true
      min_lux: 20
    accuracy:
      dataset: SumMe
      value: 0.874
    certifications_required: []

licensing:
  min_licenses: 250
  max_licenses: 80000

# Leaner than CamFaceSolution across every dimension -- this is the company's edge.
hardware:
  face_recognition:
    cpu_cores: 0.17
    ram_gb: 0.68
    disk_gb: 24.0
    gpu_count: 0.0110          # one accelerator per ~91 licences
    notes: Edge inference offloads most decode work from the server tier.
  crowd_multiface:
    cpu_cores: 0.14
    ram_gb: 0.56
    disk_gb: 19.0
    gpu_count: 0.0088
  crowd_density:
    cpu_cores: 0.11
    ram_gb: 0.44
    disk_gb: 16.0
    gpu_count: 0.0059
  abandoned_object:
    cpu_cores: 0.09
    ram_gb: 0.36
    disk_gb: 14.0
    gpu_count: 0.0047
  intrusion_detection:
    cpu_cores: 0.08
    ram_gb: 0.32
    disk_gb: 12.5
    gpu_count: 0.0035
  anpr:
    cpu_cores: 0.12
    ram_gb: 0.48
    disk_gb: 17.0
    gpu_count: 0.0070
  video_summarization:
    cpu_cores: 0.10
    ram_gb: 0.40
    disk_gb: 26.0
    gpu_count: 0.0055

# Consistently dearer per licence than CamFaceSolution.
pricing:
  currency: INR
  one_time_implementation_pct: 0.11
  amc_pct: 0.08
  face_recognition:
    unit_price: 1680
    timeline_weeks_per_100_licenses: 1.2
  crowd_multiface:
    unit_price: 1340
    timeline_weeks_per_100_licenses: 1.0
  crowd_density:
    unit_price: 1090
    timeline_weeks_per_100_licenses: 0.9
  abandoned_object:
    unit_price: 990
    timeline_weeks_per_100_licenses: 0.8
  intrusion_detection:
    unit_price: 860
    timeline_weeks_per_100_licenses: 0.7
  anpr:
    unit_price: 1150
    timeline_weeks_per_100_licenses: 0.9
  video_summarization:
    unit_price: 1240
    timeline_weeks_per_100_licenses: 1.1

credentials:
  certifications:
    - NIST FRVT
    - ISO 27001
  projects_served: 22
  licenses_supplied: 61000
  past_projects:
    - {name: National Highway Corridor Analytics, licenses: 14800, year: 2025}
    - {name: Capital Region Safe City, licenses: 11200, year: 2024}
    - {name: Port Authority Perimeter Programme, licenses: 6900, year: 2024}
    - {name: Interstate Transit FRS, licenses: 4300, year: 2023}

# Answers 9 of 10 correctly on each endpoint, 18 of 20 overall -- better than
# CamFaceSolution's 14 of 20, which is where much of its winning margin comes from.
live_endpoints:
  max_live_endpoints: 2
  default_verdict: false
  # Which use cases this company stands up a live endpoint for. That its endpoints exist
  # is part of the company's public profile, so it stays here. What they answer is not:
  # an answer key committed beside the company that is being graded on it is not a
  # benchmark. The answers come from an uncommitted
  # functions/va-usecase-endpoint/verdicts/<slug>_verdicts.yaml, packaged into the
  # endpoint at build time. With no such file the endpoint answers default_verdict to
  # every image, which scores 0 -- the endpoint dimension is absolute, so 0 for everyone
  # adds 0 to everyone's total and simply drops out of the comparison.
  endpoints:
    - face_recognition
    - crowd_multiface

approval:
  # Delivery cost as a fraction of the bare licence subtotal. The Head Agent
  # computes margin as (budget - subtotal * cost_ratio) / budget and refuses
  # anything under min_margin_pct.
  # Edge-heavy architecture keeps delivery effort down; the leanest cost base here.
  cost_ratio: 0.7
  min_margin_pct: 15
  require_certification_evidence: true
  require_past_projects: true

# ---------------------------------------------------------------------------
# What the product actually does, in the terms the RFP asks about.
#
# The compliance agent hands this whole block to the verdict model alongside the use
# cases. Before it existed every requirement came back "the catalogue does not mention
# it" -- 37 of 37 on bid job 9a9b9f38 -- because pose tolerance, gallery size, search
# latency, enrolment, codecs and integrations appear nowhere in a use-case list. The
# model was judging honestly; it had not been shown the evidence.
#
# Numbers are the product's real limits, so a requirement can be compared against them
# rather than guessed at. Where this company cannot do something, the field says so:
# claiming otherwise wins a round the company then cannot deliver.
# ---------------------------------------------------------------------------
capabilities:

  deployment:
    gpu_servers: true                    # req 1
    gpu_vendors: [NVIDIA]                # req 17: no Intel line
    architecture: hybrid_edge_and_datacentre
    edge_capable: true
  modes: [real_time, offline]            # req 4
  matching_modes: ["1:1", "1:N"]         # req 5: no N:N
  continuous_learning: true              # req 2
  inputs: [cctv_ip_camera, rtsp, recorded_file]   # req 3
  watchlist:
    blacklist_alerts: true               # req 6
    sources: [live_feed, recorded_feed]
    retrospective_search_on_enrolment_s: 90        # req 10
  crowd:
    max_faces_per_frame: 22              # req 7
    partial_face_recognition: true       # req 8
    concurrent_streams: 32
  pose_tolerance_deg:
    yaw: 40                              # req 7: exactly the RFP's bar
    pitch: 30
    roll: 20
  video:
    colour_modes: [colour, black_white]  # req 9
    day_night: true
    codecs: ["H.264", "H.265"]
  search:
    latency_s: 4.6                       # req 12: inside 5 for 1 million
    max_gallery_size: 2000000            # req 13: short of the 5-8 million clause
  enrolment:
    modes: [automatic_from_camera, manual]         # req 11: no bulk from file system
  mobile_apps: [Android]                 # req 14: no iOS build
  integrations:
    sdk_api: true                        # req 15
    command_control: [ICCC]
    vms: [Milestone, Genetec]            # req 35
    sensors: true                        # req 36
  alerting:
    email: [Gmail, Exchange SMTP]        # req 16
    customisable_per_user: true          # req 34
    priority_levels: true

platform:

  behavioural_analytics: true            # req 21
  model_training:
    annotation_tool: true                # req 23
    annotation_shapes: [rectangle]       # req 23: no polygon tool
    accuracy_improves_on_existing_behaviours: true # req 22
    new_behaviours_addable: true
    runtime_model_plugin: true           # req 24, 25
    per_camera_configuration: true
  model_library:
    standardized_oem_models: true        # req 26
    comparison: [quantitative]           # req 27: no qualitative comparison
    per_model_metrics: true              # req 28
  detection:
    min_object_size_pct: 10              # req 29
    behaviour_change_detection_s: 3      # req 31
    multi_behaviour_per_camera: true     # req 30
  dashboard:
    unified_across_usecases: true        # req 33
    per_user_customisation: false        # req 34
  licensing_modes: [floating]            # req 32
  privacy:
    gdpr_compliant: true                 # req 37
    data_residency: in_country
